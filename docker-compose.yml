services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hymns-backend
    restart: unless-stopped
    depends_on:
      rpunct:
        condition: service_healthy
    environment:
      - RPUNCT_URL=http://rpunct:8000
    ports:
      - "3100"
    volumes:
      - db_data:/app/src/data
      - uploads_data:/app/public/uploads

  rpunct:
    build:
      context: ./rpunct_service
    container_name: hymns-rpunct
    restart: unless-stopped
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  ollama:
    image: ollama/ollama:latest
    container_name: hymns-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Pull the judge model once on first deploy; exits cleanly after pulling
  ollama-init:
    image: ollama/ollama:latest
    container_name: hymns-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["ollama", "pull", "qwen2.5:1.5b"]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama_data:/root/.ollama

volumes:
  db_data:
  uploads_data:
  model_cache:
  ollama_data:
