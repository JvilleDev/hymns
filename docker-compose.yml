services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - rpunct
    environment:
      # dentro de compose se resuelve por nombre de servicio, no localhost
      - RPUNCT_URL=${RPUNCT_URL:-http://rpunct:8000}
    volumes:
      - db_data:/app/src/data
      - uploads_data:/app/public/uploads
  rpunct:
    build:
      context: ./rpunct_service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - HF_HUB_CACHE=/root/.cache/huggingface
      - PUNCT_ONNX_DIR=/app/onnx/punct
      - E5_ONNX_DIR=/app/onnx/e5
    volumes:
      - rpunct_onnx:/app/onnx
      - hf_cache:/root/.cache/huggingface

volumes:
  db_data:
  uploads_data:
  rpunct_onnx:
  hf_cache:
