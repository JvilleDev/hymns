services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hymns-backend
    restart: unless-stopped
    environment:
      # rpunct corre como servicio aparte; ajusta la URL según tu despliegue
      - RPUNCT_URL=${RPUNCT_URL:-http://127.0.0.1:8000}
    volumes:
      - db_data:/app/src/data
      - uploads_data:/app/public/uploads

volumes:
  db_data:
  uploads_data:
