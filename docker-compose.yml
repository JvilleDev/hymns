services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: hymns-backend
    restart: unless-stopped
    environment:
      - RPUNCT_URL=${RPUNCT_URL:-http://127.0.0.1:8000}
    ports:
      - "3100"
    volumes:
      - db_data:/app/src/data

volumes:
  db_data: