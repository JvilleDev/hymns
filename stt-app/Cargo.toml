[package]
name = "hymns-stt"
version = "0.1.0"
edition = "2021"
description = "Servidor local de transcripción (NVIDIA Parakeet) para la página /transcripcion"

[dependencies]
parakeet-rs = "0.4"
eframe = "0.37"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["cors"] }
serde_json = "1"
anyhow = "1"
futures-util = "0.3"
directories = "6"
reqwest = { version = "0.13", features = ["stream"] }

[build-dependencies]
embed-resource = "3"

[features]
# Aceleración opcional (por defecto CPU int8, que ya es varias veces más rápida que el tiempo real):
#   macOS:   cargo build --release --features coreml
#   Windows: cargo build --release --features directml   (o cuda)
coreml = ["parakeet-rs/coreml"]
directml = ["parakeet-rs/directml"]
cuda = ["parakeet-rs/cuda"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
