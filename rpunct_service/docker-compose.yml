services:
  rpunct:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HF_HUB_CACHE=/root/.cache/huggingface
      - PUNCT_ONNX_DIR=/app/onnx/punct
      - E5_ONNX_DIR=/app/onnx/e5
    volumes:
      - rpunct_onnx:/app/onnx
      - hf_cache:/root/.cache/huggingface

volumes:
  rpunct_onnx:
  hf_cache:
